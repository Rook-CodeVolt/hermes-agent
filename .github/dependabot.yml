# Dependabot configuration for hermes-agent.
#
# This contribution-only fork follows dependency versions from upstream.
# Routine version-update pull requests are therefore disabled here. The
# repository's separately configured Dependabot alerts and security updates
# remain enabled so vulnerability findings and security-update coverage are
# retained. No source-dependency ecosystems are configured in this fork.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
