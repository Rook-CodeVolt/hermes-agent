name: F2 exact-head standard-runner CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f2-exact-head-standard-runners
  cancel-in-progress: false

env:
  TARGET_SHA: 9fa123b250cf6aa13a6331ea5041f3f0a8223f65
  TARGET_TREE: 1f0f2966adc3ac8fa76d418fa1222ccb19c2ccac
  OPENROUTER_API_KEY: ""
  OPENAI_API_KEY: ""
  NOUS_API_KEY: ""

jobs:
  linux:
    name: Linux full suite (exact F2 head)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Restrict dispatch to fork owner
        env:
          ACTOR: ${{ github.actor }}
        run: test "$ACTOR" = "Rook-CodeVolt"

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Rook-CodeVolt/hermes-agent
          ref: 9fa123b250cf6aa13a6331ea5041f3f0a8223f65
          persist-credentials: false

      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "HEAD=$ACTUAL_SHA"
          echo "TREE=$ACTUAL_TREE"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          test "$ACTUAL_TREE" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Run complete Linux suite
        shell: bash
        env:
          HERMES_TEST_WORKERS: "4"
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh

      - name: Verify candidate remains clean
        if: always()
        shell: bash
        run: |
          git diff --check
          echo "::group::Sanitized git status (status and filename only)"
          git -c core.quotePath=true status --porcelain=v1 --untracked-files=all
          echo "::endgroup::"
          test -z "$(git status --porcelain)"

  windows:
    name: Windows-only tests (exact F2 head)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Restrict dispatch to fork owner
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
        run: test "$ACTOR" = "Rook-CodeVolt"

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Rook-CodeVolt/hermes-agent
          ref: 9fa123b250cf6aa13a6331ea5041f3f0a8223f65
          persist-credentials: false

      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "HEAD=$ACTUAL_SHA"
          echo "TREE=$ACTUAL_TREE"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          test "$ACTUAL_TREE" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: false

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Run Windows-only tests
        shell: bash
        run: |
          set -uo pipefail
          LIST="${RUNNER_TEMP:-.}/selected-tests.txt"
          if ! uv run --no-sync python scripts/ci/list_os_marked_tests.py \
                 windows_only > "$LIST"; then
            echo "::error::could not enumerate windows_only test files"
            exit 1
          fi
          if [ ! -s "$LIST" ]; then
            echo "::error::empty windows_only file list"
            exit 1
          fi
          set -- $(cat "$LIST")
          echo "selected $# file(s) for windows_only:"
          cat "$LIST"
          status=0
          uv run --no-sync python -m pytest \
            "$@" \
            --ignore-glob='*test_desktop_update_windows_*.py' \
            -m "windows_only and not integration" \
            -v --tb=short || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::No tests matched -m windows_only"
            exit 1
          fi
          exit "$status"

      - name: Verify candidate remains clean
        if: always()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
